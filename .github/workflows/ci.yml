name: CampusRideshare CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: campusride
          POSTGRES_PASSWORD: campusride_secure_pass
          POSTGRES_DB: campusride_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ml_service/requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: TypeScript Typecheck
        run: npx tsc --noEmit

      - name: Run Schema & Concurrency Tests
        run: |
          npm run test:schema
          npm run test:concurrency
          npm run test:safety

      - name: Run HTTP Integration & Authorization Tests
        env:
          JWT_SECRET: ci_test_jwt_secret_key_1234567890
        run: npm run test:integration

      - name: Run ML Intelligence Pytest Suite
        run: npm run test:ml

      - name: Build Web Client & Backend
        run: npm run build
