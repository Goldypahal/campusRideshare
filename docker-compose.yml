version: "3.8"

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: campusride-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-campusride}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-campusride_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-campusride_db}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campusride -d campusride_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: campusride-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-campusride_secure_redis_pass}
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-campusride_secure_redis_pass}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  ml-service:
    build:
      context: .
      dockerfile: Dockerfile.ml
    container_name: campusride-ml
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ML_SERVICE_PORT:-8000}:8000"
    environment:
      - PORT=8000
      - MATCHING_MODEL_TYPE=rf
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: campusride-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ml-service:
        condition: service_started
    ports:
      - "${PORT:-5000}:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-campusride}:${POSTGRES_PASSWORD:-campusride_secure_pass}@postgres:5432/${POSTGRES_DB:-campusride_db}
      REDIS_URL: redis://:${REDIS_PASSWORD:-campusride_secure_redis_pass}@redis:6379
      ML_SERVICE_URL: http://ml-service:8000
      JWT_SECRET: ${JWT_SECRET:?Error: JWT_SECRET must be explicitly set in your .env}
      ALLOWED_EMAIL_DOMAINS: edu,ac.in,edu.in
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  redis_data:
